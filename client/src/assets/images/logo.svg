<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- 浅色模式 -->
  <g id="light-mode" transform="translate(0, 0)">
    <rect x="50" y="50" width="300" height="300" fill="#ffffff" />
    <text x="200" y="200" font-family="Arial, sans-serif" font-size="80" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#333333">eest</text>
  </g>
  
  <!-- 深色模式 -->
  <g id="dark-mode" transform="translate(400, 0)">
    <rect x="50" y="50" width="300" height="300" fill="#333333" />
    <text x="200" y="200" font-family="Arial, sans-serif" font-size="80" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">eest</text>
  </g>
</svg>